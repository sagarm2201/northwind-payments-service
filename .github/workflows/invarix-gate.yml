name: INVARIX Continuous Pre-Merge Architecture Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  invarix-gate:
    name: Evaluate Architectural Risk & Code Waivers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan Codebase for Waivers & Temporary Bypasses
        run: |
          echo "Scanning for #nosec, bypasses, and temporary architectural debt..."
          grep -rn "TODO(waiver)" app/ || echo "No active code waivers found."
